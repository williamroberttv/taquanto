<div class="min-h-dvh bg-[var(--tq-canvas)] font-['Inter'] text-[var(--tq-ink)]">
  <app-header />

  <main class="search-shell px-5 py-10 sm:py-12" aria-labelledby="search-title">
    <section class="mx-auto max-w-6xl">
      <div class="max-w-3xl">
        <p class="eyebrow eyebrow-with-icon">
          Consulta de produto
          <svg class="eyebrow-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"
            />
            <path d="m3.3 7 8.7 5 8.7-5" />
            <path d="M12 22V12" />
          </svg>
        </p>
        <h1
          id="search-title"
          class="mt-3 text-4xl font-bold leading-tight text-[var(--tq-ink)] sm:text-5xl"
        >
          Buscar preços em Alagoas
        </h1>
        <p class="mt-4 leading-7 text-[var(--tq-muted)]">
          Digite um produto ou código de barras para comparar registros de venda NFC-e dos
          municípios de Alagoas retornados pela API Tá<span class="text-primary">Quanto</span>.
        </p>
      </div>

      <app-product-search-form
        [query]="query()"
        [loading]="pricesLoading()"
        [message]="inlineMessage()"
        (queryChange)="updateQuery($event)"
        (searchSubmitted)="submitSearch()"
      />

      <app-search-filters
        [municipality]="municipality()"
        [days]="days()"
        (municipalityChange)="selectMunicipality($event)"
        (daysChange)="selectPeriod($event)"
      />

      <app-recent-searches [searches]="recentSearches()" (searchSelected)="repeatSearch($event)" />

      <app-search-results
        [records]="records()"
        [pagination]="pagination()"
        [loading]="pricesLoading()"
        [emptyMessage]="emptyMessage()"
        [cacheMessage]="cacheMessage()"
        [cachePending]="cachePending()"
        [isFavorite]="isFavorite"
        (favoriteToggled)="toggleFavorite($event)"
        (detailsRequested)="openRecordDetail($event)"
        (pageSelected)="loadPage($event)"
      />
    </section>
  </main>

  @if (pagination() && !filtersVisible()) {
    <div class="fab">
      <button
        type="button"
        class="back-to-search btn btn-circle btn-primary shadow-lg"
        aria-label="Voltar ao formulário de busca"
        title="Voltar ao formulário de busca"
        (click)="scrollToFilters()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m6 15 6-6 6 6" />
        </svg>
      </button>
    </div>
  }

  @if (selectedRecord(); as record) {
    <app-sale-record-detail-dialog
      [record]="record"
      [favorite]="isFavorite(record)"
      (favoriteToggled)="toggleFavorite($event)"
      (closed)="closeRecordDetail()"
    />
  }

  @if (toast()) {
    <div class="toast toast-end z-70">
      <p class="alert alert-error max-w-sm font-semibold" role="alert">{{ toast() }}</p>
    </div>
  }

  <app-footer />
</div>
