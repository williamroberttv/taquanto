<div class="min-h-dvh bg-[var(--tq-canvas)] font-['Inter'] text-[var(--tq-ink)]">
  <app-header />

  <main class="search-shell px-5 py-10 sm:py-12" aria-labelledby="fuels-title">
    <section class="mx-auto max-w-6xl">
      <div class="max-w-3xl">
        <p class="eyebrow eyebrow-with-icon">
          Consulta de combustível
          <svg class="eyebrow-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18" />
            <path d="M3 22h16M8 6h6v5H8zM17 7h2l2 2v8a2 2 0 0 1-4 0v-3" />
          </svg>
        </p>
        <h1
          id="fuels-title"
          class="mt-3 text-4xl font-bold leading-tight text-[var(--tq-ink)] sm:text-5xl"
        >
          Consultar combustíveis em Alagoas
        </h1>
        <p class="mt-4 leading-7 text-[var(--tq-muted)]">
          Compare registros de venda NFC-e de combustíveis retornados pela API Tá<span
            class="text-primary"
            >Quanto</span
          >. Os valores são históricos, não ofertas ou garantia de preço atual.
        </p>
      </div>

      <form
        #fuelForm
        id="fuel-search"
        tabindex="-1"
        class="card mt-8 grid scroll-mt-20 gap-4 bg-base-100 p-5 shadow-sm sm:grid-cols-[1fr_auto] sm:items-end"
        aria-labelledby="fuel-search-title"
        (submit)="submit($event)"
      >
        <div class="fieldset">
          <label id="fuel-search-title" class="fieldset-legend" for="fuel-type">
            Tipo de combustível
          </label>
          <select
            id="fuel-type"
            class="select min-h-12 w-full"
            [value]="type()"
            (change)="selectType($event)"
          >
            @for (fuel of fuelTypes; track fuel.id) {
              <option [value]="fuel.id">{{ fuel.label }}</option>
            }
          </select>
        </div>
        <button type="submit" class="btn btn-primary min-h-12" [disabled]="!filtersReady()">
          {{ !filtersReady() ? 'Carregando mapa...' : loading() ? 'Consultando...' : 'Consultar' }}
        </button>
      </form>

      <app-search-filters
        [municipality]="municipality()"
        [days]="days()"
        [productSearch]="false"
        (municipalityChange)="selectMunicipality($event)"
        (municipalityReady)="municipalityReady($event)"
        (daysChange)="selectPeriod($event)"
      />

      <app-search-results
        kind="fuel"
        [actions]="false"
        [records]="records()"
        [pagination]="pagination()"
        [loading]="loading()"
        [emptyMessage]="emptyMessage()"
        [cacheMessage]="cacheMessage()"
        [cachePending]="cachePending()"
        (pageSelected)="loadPage($event)"
      />
    </section>
  </main>

  @if (pagination()) {
    <div class="fab">
      <button
        type="button"
        class="back-to-search btn btn-circle btn-primary shadow-lg"
        aria-label="Voltar ao formulário de consulta"
        title="Voltar ao formulário de consulta"
        (click)="scrollToForm()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m6 15 6-6 6 6" />
        </svg>
      </button>
    </div>
  }

  @if (toast()) {
    <div class="toast toast-end z-70">
      <p class="alert alert-error max-w-sm font-semibold" role="alert">{{ toast() }}</p>
    </div>
  }

  <app-footer />
</div>
